<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      var l = window.location;
      var base = '/youtube-vj-edit';
      var path = l.pathname.slice(base.length) || '/';
      var search = l.search;
      var hash = l.hash;
      var redirect = base + '/?p=' + encodeURIComponent(path + search) + hash;
      l.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
